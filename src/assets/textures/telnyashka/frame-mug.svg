  <path d="M18 85 H102 M18 96 H102" stroke="#2a2016" stroke-width="1.4"/>
  <rect x="18" y="74" width="84" height="3" fill="#6b5538"/>
  <!-- mug -->
  <path d="M46 48 H70 V72 Q70 76 66 76 H50 Q46 76 46 72 Z" fill="url(#mug)"/>
  <ellipse cx="58" cy="48" rx="12" ry="3" fill="#9a9a92"/>
  <ellipse cx="58" cy="48.6" rx="10.4" ry="2.2" fill="#5d5d58"/>
  <path d="M70 53 q9 0 9 8 q0 8 -9 8" stroke="#8a8a84" stroke-width="3" fill="none"/>
  <rect x="8" y="8" width="104" height="100" filter="url(#g)"/>
</svg>
