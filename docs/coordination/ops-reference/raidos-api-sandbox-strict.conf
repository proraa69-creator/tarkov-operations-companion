# Added 27.11.2026 (security review): the API writes only its data; no devices, capabilities or namespaces.
# Sorted after least-privilege.conf, so ProtectSystem=strict here replaces its ProtectSystem=full.
[Service]
ProtectSystem=strict
ReadWritePaths=/var/lib/raidos /var/lib/raidos/map-mirror
ProtectHome=tmpfs
PrivateDevices=yes
ProtectProc=invisible
ProtectKernelLogs=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
LockPersonality=yes
SystemCallArchitectures=native
CapabilityBoundingSet=
AmbientCapabilities=
