server {
    server_name raidos.app www.raidos.app _;

    root /opt/tarkov-operations-companion/website/dist;
    index index.html;

    location ~ "^/item-images/([a-z0-9]{16,48}-(?:icon|grid)\.(?:webp|jpg|jpeg|png))$" {
        include /etc/nginx/snippets/raidos-security-headers.conf;
        alias /var/cache/raidos/item-images/$1;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /item-images/ {
        return 404;
    }

    location = /download/windows {
        include /etc/nginx/snippets/raidos-security-headers.conf;
        alias /opt/tarkov-operations-companion/website/dist/downloads/RaidOSClient.exe;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment; filename=RaidOSClient.exe" always;
        add_header Cache-Control "no-store" always;
    }

    location = /download/version.json {
        include /etc/nginx/snippets/raidos-security-headers.conf;
        alias /opt/tarkov-operations-companion/website/dist/downloads/release.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = / {
        include /etc/nginx/snippets/raidos-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        include /etc/nginx/snippets/raidos-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/raidos.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/raidos.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.raidos.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = raidos.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name raidos.app www.raidos.app _;
    return 404; # managed by Certbot




}
