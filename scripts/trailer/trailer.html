<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Raid OS — трейлер</title>
<meta name="viewport" content="width=1920, height=1080">
<style>
@font-face { font-family: 'Inter'; font-weight: 100 900; src: url(assets/fonts/inter-cyrillic.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Inter'; font-weight: 100 900; src: url(assets/fonts/inter-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Oswald'; font-weight: 200 700; src: url(assets/fonts/oswald-cyrillic.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Oswald'; font-weight: 200 700; src: url(assets/fonts/oswald-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

:root {
  /* From src/styles/tokens.css */
  --bg: #0a0f0c; --panel: #141d18; --line: #2b3a30; --text: #edf2ed; --text-muted: #97a49a;
  --brass: #c4a665; --brass-strong: #dfbd70; --green: #7fa183;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #050806; }
body { font-family: Inter, 'DejaVu Sans', sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: #050806; }
.scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
.layer { position: absolute; inset: 0; transform-origin: 0 0; }
.shot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; will-change: transform; transform-origin: 0 0; max-width: none; }
.shade { position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(180deg, rgb(5 8 6 / 0%) 46%, rgb(5 8 6 / 74%) 76%, rgb(5 8 6 / 95%) 100%),
    linear-gradient(90deg, rgb(5 8 6 / 62%) 0%, rgb(5 8 6 / 0%) 42%); }

/* Dark survey-grid backdrop for two-up scenes */
.bg-grid { position: absolute; inset: 0;
  background:
    radial-gradient(1100px 640px at 70% 30%, rgb(196 166 101 / 11%), transparent 70%),
    radial-gradient(900px 600px at 10% 100%, rgb(127 161 131 / 10%), transparent 70%),
    linear-gradient(180deg, #0d140f, #070a08); }
.bg-grid::after { content: ''; position: absolute; inset: 0; opacity: .6;
  background-image: linear-gradient(rgb(196 166 101 / 6%) 1px, transparent 1px), linear-gradient(90deg, rgb(196 166 101 / 6%) 1px, transparent 1px);
  background-size: 96px 96px; mask-image: radial-gradient(1000px 640px at 50% 40%, #000 20%, transparent 80%); }

/* Captions ----------------------------------------------------------------------------------- */
.caption { position: absolute; left: 120px; bottom: 80px; z-index: 8; }
.caption .eyebrow { display: flex; align-items: center; gap: 14px; font: 700 20px/1 Inter, sans-serif; letter-spacing: .26em; text-transform: uppercase; color: var(--brass); }
.caption .eyebrow b { display: inline-grid; place-items: center; min-width: 44px; height: 30px; padding: 0 8px; border: 1px solid rgb(196 166 101 / 55%); border-radius: 6px; font-size: 16px; letter-spacing: .08em; color: var(--brass-strong); background: rgb(196 166 101 / 10%); }
.caption h2 { margin-top: 16px; font: 800 66px/1.04 Inter, sans-serif; letter-spacing: -.02em; text-shadow: 0 6px 40px rgb(0 0 0 / 70%); max-width: 1500px; }
.caption .bar { margin-top: 22px; height: 4px; width: 220px; border-radius: 2px; background: linear-gradient(90deg, var(--brass-strong), rgb(196 166 101 / 0%)); transform-origin: 0 50%; }
.pills { display: flex; gap: 12px; margin-top: 24px; }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px 11px 16px; border-radius: 999px; font: 600 23px/1 Inter, sans-serif; color: #e6ebe4;
  background: rgb(10 15 12 / 80%); border: 1px solid rgb(196 166 101 / 38%); box-shadow: 0 10px 30px rgb(0 0 0 / 40%); white-space: nowrap; }
.pill i { width: 10px; height: 10px; border-radius: 50%; background: var(--brass-strong); box-shadow: 0 0 12px rgb(223 189 112 / 70%); flex: none; }
.pill.hot { border-color: rgb(223 189 112 / 75%); color: #fff6dc; }
.pill.red i { background: #e0674f; box-shadow: 0 0 12px rgb(224 103 79 / 70%); }
.pill.green i { background: #7fc79a; box-shadow: 0 0 12px rgb(127 199 154 / 70%); }
.pill em { font-style: normal; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--brass-strong); color: #17130a; font: 800 16px/1 Inter, sans-serif; margin: -3px 0; }
.pill .arr { width: 22px; height: 12px; margin: 0 -2px; }

/* Windows (cropped screenshot panes) ------------------------------------------------------------ */
.win { position: absolute; overflow: hidden; border-radius: 16px; border: 1px solid rgb(196 166 101 / 40%); background: #0a0f0c;
  box-shadow: 0 0 0 6px rgb(196 166 101 / 5%), 0 40px 90px rgb(0 0 0 / 65%); }
.win img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; will-change: transform; max-width: none; }
.card { position: absolute; border-radius: 16px; overflow: hidden; background: rgb(8 12 10 / 80%); border: 1px solid rgb(196 166 101 / 40%); box-shadow: 0 30px 80px rgb(0 0 0 / 65%); }
.card img { display: block; }
.card.bare { background: none; border: 0; box-shadow: none; border-radius: 0; overflow: visible; }
.label { position: absolute; z-index: 4; padding: 10px 18px; border-radius: 10px; font: 800 20px/1 Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--brass-strong);
  background: rgb(8 12 10 / 90%); border: 1px solid rgb(196 166 101 / 50%); box-shadow: 0 12px 30px rgb(0 0 0 / 50%); white-space: nowrap; }
.label.green { color: #b8d1ba; border-color: rgb(127 161 131 / 55%); }

/* Intro / outro ------------------------------------------------------------------------------ */
.title-scene { display: grid; place-items: center; text-align: center; }
.title-bg { position: absolute; inset: -40px; background-size: cover; filter: blur(14px) saturate(.8) brightness(.32); }
.title-glow { position: absolute; inset: 0;
  background: radial-gradient(900px 520px at 50% 48%, rgb(196 166 101 / 22%), rgb(196 166 101 / 0%) 70%), radial-gradient(1400px 900px at 50% 50%, rgb(5 8 6 / 0%), rgb(5 8 6 / 88%) 75%); }
.title-lines { position: absolute; inset: 0; opacity: .5;
  background-image: linear-gradient(rgb(196 166 101 / 7%) 1px, transparent 1px), linear-gradient(90deg, rgb(196 166 101 / 7%) 1px, transparent 1px);
  background-size: 96px 96px; background-position: -1px -1px; mask-image: radial-gradient(900px 600px at 50% 50%, #000 20%, transparent 75%); }
.title-block { position: relative; z-index: 2; display: grid; justify-items: center; }
.brand-badge { width: 136px; height: 136px; border-radius: 30px; box-shadow: 0 30px 80px rgb(0 0 0 / 60%); }
.brand-badge img { width: 136px; height: 136px; display: block; }
.kicker { margin-top: 42px; font: 700 22px/1 Inter, sans-serif; letter-spacing: .5em; text-transform: uppercase; color: var(--brass); padding-left: .5em; }
.big-title { margin-top: 22px; font: 700 128px/1 Oswald, Inter, sans-serif; letter-spacing: .015em; text-transform: uppercase;
  background: linear-gradient(180deg, #fbf1d6 0%, #e7cb86 42%, #b8924c 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 10px 40px rgb(0 0 0 / 70%)); white-space: nowrap; }
.rule { margin-top: 34px; width: 560px; height: 2px; background: linear-gradient(90deg, transparent, var(--brass), transparent); }
.tagline { margin-top: 30px; font: 500 30px/1.3 Inter, sans-serif; color: #c9d2ca; letter-spacing: .01em; }
.tagline span { color: var(--brass); padding: 0 10px; }
.cta { margin-top: 44px; display: inline-flex; align-items: center; gap: 18px; padding: 28px 58px; border-radius: 16px;
  background: linear-gradient(180deg, #e2c47c, #b48f4b); color: #17130a; font: 800 44px/1 Inter, sans-serif; letter-spacing: -.01em;
  box-shadow: 0 0 0 1px rgb(255 240 200 / 35%) inset, 0 24px 70px rgb(196 166 101 / 30%), 0 10px 30px rgb(0 0 0 / 50%); }
.cta svg { width: 44px; height: 44px; }
.fine { margin-top: 26px; font: 600 22px/1 Inter, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: var(--text-muted); padding-left: .3em; }
.site { margin-top: 26px; font: 700 44px/1 Oswald, Inter, sans-serif; letter-spacing: .14em; color: var(--brass-strong); padding-left: .14em; }

/* In-game backdrop (drawn here, no game footage) --------------------------------------------- */
.game { position: absolute; inset: 0; overflow: hidden;
  background: radial-gradient(1200px 700px at 22% 18%, rgb(170 180 160 / 20%), transparent 65%), radial-gradient(900px 500px at 80% 85%, rgb(60 80 60 / 30%), transparent 70%),
    linear-gradient(180deg, #2a302b 0%, #1a1f1b 42%, #0f1310 43%, #141a15 70%, #0a0d0b 100%); }
.game .haze { position: absolute; inset: -10%; filter: blur(40px); opacity: .7;
  background: radial-gradient(420px 180px at 30% 40%, rgb(200 205 190 / 18%), transparent 70%), radial-gradient(520px 220px at 70% 36%, rgb(180 190 170 / 14%), transparent 70%), radial-gradient(700px 260px at 50% 60%, rgb(0 0 0 / 35%), transparent 70%); }
.game .ridge { position: absolute; left: -5%; right: -5%; top: 36%; height: 200px; opacity: .55; filter: blur(3px);
  background: linear-gradient(180deg, #151a16, #0d110e);
  clip-path: polygon(0 60%, 6% 48%, 12% 55%, 20% 38%, 27% 46%, 34% 30%, 41% 42%, 50% 34%, 58% 44%, 66% 28%, 74% 40%, 82% 33%, 90% 46%, 100% 38%, 100% 100%, 0 100%); }
.game .grain { position: absolute; inset: 0; opacity: .16; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }
.game .vignette { position: absolute; inset: 0; background: radial-gradient(1200px 760px at 50% 50%, transparent 40%, rgb(0 0 0 / 78%) 100%); }
.hud { position: absolute; inset: 44px; pointer-events: none; }
.hud i { position: absolute; width: 60px; height: 60px; border-color: rgb(220 225 210 / 28%); border-style: solid; }
.hud i:nth-child(1) { left: 0; top: 0; border-width: 2px 0 0 2px; } .hud i:nth-child(2) { right: 0; top: 0; border-width: 2px 2px 0 0; }
.hud i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 2px 2px; } .hud i:nth-child(4) { right: 0; bottom: 0; border-width: 0 2px 2px 0; }
.hud-note { position: absolute; left: 76px; top: 8px; font: 600 15px/1 Inter, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: rgb(220 225 210 / 50%); }
.compass { position: absolute; left: 50%; top: 26px; width: 640px; margin-left: -320px; height: 36px; overflow: hidden; opacity: .55; mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent); }
.compass-strip { position: absolute; top: 0; left: 0; height: 36px; width: 2400px; display: flex; }
.compass-strip span { flex: 0 0 40px; border-left: 1px solid rgb(230 230 220 / 50%); height: 10px; position: relative; }
.compass-strip span:nth-child(3n+1) { height: 16px; }
.compass-strip em { position: absolute; top: 18px; left: -6px; font: 600 14px/1 Inter, sans-serif; font-style: normal; color: rgb(235 235 225 / 80%); }
.stash { position: absolute; left: 130px; top: 150px; width: 700px; height: 490px; border: 1px solid rgb(200 205 190 / 20%); background-color: rgb(12 15 13 / 72%); box-shadow: 0 30px 80px rgb(0 0 0 / 55%);
  background-image: linear-gradient(rgb(200 205 190 / 10%) 1px, transparent 1px), linear-gradient(90deg, rgb(200 205 190 / 10%) 1px, transparent 1px); background-size: 70px 70px; }
.stash .head { position: absolute; left: -1px; right: -1px; top: -44px; height: 44px; display: flex; align-items: center; padding: 0 16px; font: 700 17px/1 Inter, sans-serif; letter-spacing: .2em; color: rgb(220 225 210 / 70%); background: rgb(30 36 32 / 90%); border: 1px solid rgb(200 205 190 / 20%); }
.cell { position: absolute; border: 1px solid rgb(200 205 190 / 18%); background: linear-gradient(160deg, rgb(70 80 72 / 55%), rgb(30 36 32 / 55%)); }
.cell::after { content: ''; position: absolute; inset: 22%; border-radius: 6px; background: rgb(200 205 190 / 10%); }
.cell.hot { border-color: rgb(223 189 112 / 85%); box-shadow: 0 0 0 2px rgb(223 189 112 / 35%), 0 0 30px rgb(223 189 112 / 25%); }
.cell.hot::after { background: rgb(223 189 112 / 18%); }
.cell.hot2 { border-color: rgb(127 190 150 / 85%); box-shadow: 0 0 0 2px rgb(127 190 150 / 35%), 0 0 30px rgb(127 190 150 / 25%); }
.cell.hot2::after { background: rgb(127 190 150 / 18%); }
.toast { position: absolute; z-index: 4; padding: 14px 18px; border: 1px solid rgb(196 166 101 / 40%); border-radius: 12px; background: rgb(20 18 12 / 92%); color: #f0d48c; font: 700 21px/1.2 Inter, sans-serif; box-shadow: 0 16px 40px rgb(0 0 0 / 50%); }
.toast small { display: block; margin-top: 7px; color: #9a9f90; font: 500 15px/1.2 'DejaVu Sans Mono', monospace; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 6; }
.lead { position: absolute; height: 2px; background: linear-gradient(90deg, rgb(223 189 112 / 0%), rgb(223 189 112 / 95%)); transform-origin: 0 50%; z-index: 3; }

/* Devices */
.phone { position: absolute; padding: 12px; border-radius: 54px; border: 1px solid #4a584c; background: linear-gradient(160deg, #202822, #070908); box-shadow: 0 40px 100px rgb(0 0 0 / 70%), inset 0 1px 0 rgb(255 255 255 / 10%); }
.phone .screen { position: relative; overflow: hidden; border-radius: 42px; background: #0a0f0c; }
.phone .screen img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.phone::before { content: ''; position: absolute; z-index: 3; left: 50%; top: 22px; width: 92px; height: 24px; margin-left: -46px; border-radius: 14px; background: #050706; }
.platform { position: absolute; z-index: 2; width: 360px; padding: 26px 30px; border-radius: 20px; background: rgb(10 15 12 / 80%); border: 1px solid rgb(196 166 101 / 40%); box-shadow: 0 30px 80px rgb(0 0 0 / 55%); }
.platform b { display: block; font: 700 64px/1 Oswald, Inter, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: #f0e6c8; }
.platform span { display: block; margin-top: 12px; font: 700 22px/1 Inter, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--brass-strong); }
.soon { position: absolute; z-index: 6; padding: 10px 20px; border-radius: 999px; border: 1px solid #8a7747; background: #2a2215; color: #f0d48c; font: 800 22px/1 Inter, sans-serif; letter-spacing: .14em; text-transform: uppercase; box-shadow: 0 14px 34px rgb(0 0 0 / 50%); }
.monitor { position: absolute; padding: 10px; border-radius: 18px; border: 1px solid #4a584c; background: linear-gradient(160deg, #1d251f, #080a09); box-shadow: 0 40px 100px rgb(0 0 0 / 65%); }
.monitor .screen { position: relative; overflow: hidden; border-radius: 8px; background: #0a0f0c; }
.screen > img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; display: block; }
.stand { position: absolute; height: 14px; border-radius: 0 0 14px 14px; background: linear-gradient(180deg, #2a332c, #111613); }
.browser { position: absolute; border-radius: 14px; border: 1px solid #4a584c; background: #131a15; box-shadow: 0 40px 100px rgb(0 0 0 / 65%); overflow: hidden; }
.browser .bar { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #1b231d; border-bottom: 1px solid #2b3a30; }
.browser .bar b { width: 12px; height: 12px; border-radius: 50%; background: #3a463d; }
.browser .url { margin-left: 14px; flex: 1; height: 28px; border-radius: 8px; background: #0c120e; color: #aab6ac; font: 600 16px/28px Inter, sans-serif; padding: 0 14px; }
.browser .screen { position: relative; overflow: hidden; }
.sync-line { position: absolute; height: 3px; border-radius: 2px; background: repeating-linear-gradient(90deg, rgb(223 189 112 / 90%) 0 14px, transparent 14px 28px); transform-origin: 0 50%; z-index: 2; }
.sync-node { position: absolute; z-index: 3; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: #2a2215; border: 2px solid var(--brass-strong); box-shadow: 0 0 40px rgb(223 189 112 / 40%); }
.sync-node svg { width: 30px; height: 30px; stroke: var(--brass-strong); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.qr { position: absolute; z-index: 5; display: flex; align-items: center; gap: 24px; padding: 20px 28px 20px 20px; border-radius: 20px; background: rgb(8 12 10 / 92%); border: 1px solid rgb(196 166 101 / 50%); box-shadow: 0 30px 80px rgb(0 0 0 / 65%); }
.qr img { width: 170px; height: 170px; border-radius: 10px; display: block; }
.qr strong { display: block; font: 800 32px/1.1 Inter, sans-serif; letter-spacing: -.01em; }
.qr span { display: block; margin-top: 10px; font: 500 21px/1.35 Inter, sans-serif; color: #b4bfb6; max-width: 250px; }

/* Boss row */
.busts { position: absolute; display: grid; grid-template-columns: repeat(4, 150px); gap: 26px 24px; }
.bust { text-align: center; }
.bust div { width: 150px; height: 150px; border-radius: 20px; overflow: hidden; border: 1px solid rgb(196 166 101 / 45%); background: #101712; box-shadow: 0 16px 40px rgb(0 0 0 / 55%); }
.bust img { width: 150px; height: 150px; display: block; }
.bust span { display: block; margin-top: 10px; font: 700 20px/1 Inter, sans-serif; color: #dfe6df; }

/* Global film layers */
#letter { position: absolute; inset: 0; pointer-events: none; z-index: 20; box-shadow: inset 0 0 220px rgb(0 0 0 / 55%); }
#grain { position: absolute; inset: 0; pointer-events: none; z-index: 21; opacity: .06; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
#progress { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; z-index: 22; background: linear-gradient(90deg, var(--brass), var(--brass-strong)); transform-origin: 0 50%; transform: scaleX(0); opacity: .75; }
#fade { position: absolute; inset: 0; background: #000; z-index: 30; pointer-events: none; }

/* ---- v3 additions ------------------------------------------------------------------------------- */
.caption.top { top: 70px; bottom: auto; }
.top-shade { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgb(5 8 6 / 96%) 0%, rgb(5 8 6 / 80%) 8%, rgb(5 8 6 / 0%) 22%),
    radial-gradient(1100px 330px at 22% 12%, rgb(5 8 6 / 78%), rgb(5 8 6 / 0%) 100%),
    linear-gradient(0deg, rgb(5 8 6 / 55%) 0%, rgb(5 8 6 / 0%) 18%); }
/* highlight box + tag pinned to a block of a screenshot (lives inside the moving layer, in screenshot px) */
.hl { position: absolute; z-index: 3; border: 2px solid rgb(223 189 112 / 95%); border-radius: 12px;
  box-shadow: 0 0 0 4px rgb(223 189 112 / 16%), 0 0 40px rgb(223 189 112 / 28%), inset 0 0 30px rgb(223 189 112 / 10%); }
.hl .tag { position: absolute; left: -2px; top: -38px; padding: 7px 14px; border-radius: 9px 9px 9px 0; white-space: nowrap;
  font: 800 19px/1 Inter, sans-serif; letter-spacing: .02em; color: #17130a; background: linear-gradient(180deg, #e7cb86, #c4a665); box-shadow: 0 10px 26px rgb(0 0 0 / 45%); }
.hl.right .tag { left: auto; right: -2px; border-radius: 9px 9px 0 9px; }
.hl.below .tag { top: auto; bottom: -38px; border-radius: 0 9px 9px 9px; }

/* EFT-like stash grid for «Продать или оставить?» (icons cut out of the owner's stash screenshot) */
.eft-stash { position: absolute; z-index: 2; background: rgb(8 10 10 / 92%); border: 1px solid #3c4140; box-shadow: 0 30px 80px rgb(0 0 0 / 60%); }
.eft-stash .head { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: linear-gradient(180deg, #2b2f2e, #1d2020); border-bottom: 1px solid #3c4140;
  font: 700 18px/1 Inter, sans-serif; color: #d6d6cf; letter-spacing: .02em; }
.eft-stash .head i { width: 12px; height: 12px; border: 2px solid #9a9f97; border-radius: 3px; }
.eft-grid { position: relative; margin: 10px;
  background-color: #0c0f0f;
  background-image: linear-gradient(rgb(255 255 255 / 9%) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / 9%) 1px, transparent 1px);
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 9%); }
.eft-item { position: absolute; overflow: hidden; outline: 1px solid rgb(0 0 0 / 60%); }
.eft-item img { display: block; width: 100%; height: 100%; }
.eft-item .glow { position: absolute; inset: 0; opacity: 0; background: rgb(255 255 255 / 16%); box-shadow: inset 0 0 0 2px rgb(240 236 220 / 95%), inset 0 0 26px rgb(255 255 255 / 25%); }

/* PvP / PvE / Season switch, drawn like the app's top bar control */
.mode-switch-big { position: absolute; z-index: 5; display: flex; gap: 8px; padding: 10px; border-radius: 18px; background: #0a0f0c; border: 1px solid rgb(196 166 101 / 55%); box-shadow: 0 30px 80px rgb(0 0 0 / 60%); }
.mode-switch-big span { position: relative; z-index: 1; display: grid; place-items: center; width: 190px; height: 74px; border-radius: 12px; font: 800 30px/1 Inter, sans-serif; letter-spacing: .04em; color: #97a49a; }
.mode-switch-big .knob { position: absolute; z-index: 0; left: 10px; top: 10px; width: 190px; height: 74px; border-radius: 12px; background: linear-gradient(180deg, #e2c47c, #b48f4b); box-shadow: 0 10px 30px rgb(196 166 101 / 35%); }
.mode-switch-big span.on { color: #17130a; }
.base-chip { position: absolute; z-index: 5; padding: 12px 20px; border-radius: 12px; background: rgb(8 12 10 / 92%); border: 1px solid rgb(127 161 131 / 55%); color: #cfe1d1; font: 700 24px/1 Inter, sans-serif; box-shadow: 0 16px 40px rgb(0 0 0 / 50%); white-space: nowrap; }
.base-chip b { color: var(--brass-strong); }

/* Bosses: the 3D model as a frame sequence on a floor glow, and the health card */
.boss-stage { position: absolute; z-index: 2; }
.boss-stage::before { content: ''; position: absolute; left: 10%; right: 10%; bottom: 3%; height: 60px; border-radius: 50%; background: radial-gradient(closest-side, rgb(0 0 0 / 65%), transparent); }
.boss-stage::after { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(48% 46% at 50% 52%, rgb(196 166 101 / 16%), transparent 70%); }
.boss-stage img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; }
.boss-name { position: absolute; z-index: 4; display: flex; align-items: center; gap: 14px; font: 700 54px/1 Oswald, Inter, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: #f3e7c6; text-shadow: 0 8px 30px rgb(0 0 0 / 70%); white-space: nowrap; }
.badge-3d { display: inline-grid; place-items: center; height: 40px; padding: 0 12px; border-radius: 9px; font: 800 22px/1 Inter, sans-serif; letter-spacing: .06em; color: #17130a; background: linear-gradient(180deg, #e2c47c, #b48f4b); }
.hp-card { position: absolute; z-index: 3; border-radius: 16px; overflow: hidden; border: 1px solid rgb(196 166 101 / 40%); background: #0a0f0c; box-shadow: 0 30px 80px rgb(0 0 0 / 60%); }
.hp-card img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
.hp-card img.base { opacity: 1; }

/* Fair play */
.fair { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; z-index: 2; }
.fair-block { display: grid; justify-items: center; }
.shield { width: 150px; height: 150px; filter: drop-shadow(0 20px 50px rgb(196 166 101 / 30%)); }
.fair h2 { margin-top: 30px; font: 700 96px/1 Oswald, Inter, sans-serif; letter-spacing: .02em; text-transform: uppercase;
  background: linear-gradient(180deg, #fbf1d6 0%, #e7cb86 42%, #b8924c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.fair p { margin-top: 26px; font: 600 34px/1.3 Inter, sans-serif; color: #dfe6df; }
.fair ul { margin-top: 34px; display: grid; grid-template-columns: repeat(2, auto); gap: 18px 28px; list-style: none; text-align: left; }
.fair li { display: flex; align-items: center; gap: 16px; padding: 18px 26px; border-radius: 14px; background: rgb(10 15 12 / 82%); border: 1px solid rgb(127 161 131 / 45%); font: 600 28px/1.15 Inter, sans-serif; color: #e6ebe4; box-shadow: 0 16px 40px rgb(0 0 0 / 45%); }
.fair li svg { flex: none; width: 34px; height: 34px; }

/* In-game overlay window chrome around the minimap card */
.ov-frame { position: absolute; z-index: 3; filter: drop-shadow(0 30px 60px rgb(0 0 0 / 60%)); }
.ov-frame img { display: block; }
.ping { position: absolute; z-index: 4; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 3px solid rgb(223 189 112 / 95%); }
/* Advert only: the Raid OS badge in the corner while the features play */
#wm { position: absolute; z-index: 19; right: 46px; bottom: 30px; display: flex; align-items: center; gap: 14px; opacity: 0; pointer-events: none; }
#wm img { width: 52px; height: 52px; border-radius: 12px; box-shadow: 0 10px 26px rgb(0 0 0 / 55%); }
#wm b { display: block; font: 700 30px/1 Oswald, Inter, sans-serif; letter-spacing: .06em; color: #f3e7c6; text-shadow: 0 4px 18px rgb(0 0 0 / 70%); }
#wm span { display: block; margin-top: 5px; font: 700 16px/1 Inter, sans-serif; letter-spacing: .12em; color: var(--brass-strong); text-shadow: 0 4px 18px rgb(0 0 0 / 70%); }
/* Mouse pointer for the «наведение» demo on the health card */
.cursor { position: absolute; z-index: 9; left: 0; top: 0; width: 34px; height: 44px; filter: drop-shadow(0 6px 10px rgb(0 0 0 / 60%)); pointer-events: none; }
/* Scan sweep over the Collector grid («синхронизация из схрона») */
.scan { position: absolute; z-index: 3; top: 0; bottom: 0; width: 140px; opacity: 0;
  background: linear-gradient(90deg, rgb(223 189 112 / 0%), rgb(223 189 112 / 22%) 70%, rgb(240 214 150 / 85%) 96%, rgb(223 189 112 / 0%)); }
</style>
</head>
<body>
<div id="stage"></div>

<script>
/*
 * Raid OS trailer v3 (owner's storyboard, 10.10.2026): fixed timeline built with the Web Animations API. Every animation is created up front with an
 * absolute delay, so the page can play in real time (window.__play) or be stepped frame by frame
 * (window.__seek(seconds)) by render.mjs. No cursor, no scrolling: clean stills with captions, Ken Burns moves,
 * floating cards and cross-fades. Scenes are built from SCENES below (markup helpers first, timeline after).
 */
const $ = (s, r = document) => r.querySelector(s)
const ms = (s) => Math.round(s * 1000)
const stage = $('#stage')
const SH = (n) => `shots/${n}`

const EASE = 'cubic-bezier(.22,.61,.36,1)'
const SMOOTH = 'cubic-bezier(.45,.05,.55,.95)'
const POP = 'cubic-bezier(.2,1.25,.4,1)'
function anim(el, frames, start, dur, easing = EASE) {
  if (typeof el === 'string') el = $(el)
  return el.animate(frames, { delay: ms(start), duration: ms(dur), fill: 'both', easing })
}

// ---- markup helpers -----------------------------------------------------------------------------
let uid = 0
const id = (p) => `${p}${++uid}`
const ARROW = '<svg class="arr" viewBox="0 0 22 12" fill="none" stroke="#dfbd70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h19M15 1l5 5-5 5"/></svg>'
function sceneEl(sid, inner) {
  const s = document.createElement('section')
  s.className = 'scene'; s.id = sid; s.innerHTML = inner
  stage.appendChild(s)
  return s
}
/** Caption block: eyebrow number chip + big headline + brass bar + optional pills ([text, cls] or {html}). */
function captionHtml(n, eyebrow, headline, pills = []) {
  if (typeof pills === 'string') return `<div class="caption"><div class="eyebrow"><b>${n}</b>${eyebrow}</div><h2>${headline}</h2><div class="bar"></div><div class="pills">${pills}</div></div>`
  const p = pills.map((x) => (typeof x === 'string' ? `<span class="pill"><i></i>${x}</span>` : `<span class="pill ${x[1] ?? ''}">${x[2] ?? '<i></i>'}${x[0]}</span>`)).join('')
  return `<div class="caption"><div class="eyebrow"><b>${n}</b>${eyebrow}</div><h2>${headline}</h2><div class="bar"></div>${p ? `<div class="pills">${p}</div>` : ''}</div>`
}
/** Camera on a full-bleed 1920x1080 still: [centerX, centerY, zoom]. */
const cam = ([x, y, z]) => `translate(${960 - x * z}px, ${540 - y * z}px) scale(${z})`
/** Region of a still shown in a w x h window: [centerX, centerY, regionWidth] (in 1920x1080 px of the still). */
function region(w, h, [cx, cy, rw]) {
  const s = w / rw
  return `translate(${-(cx - rw / 2) * s}px, ${-(cy - h / s / 2) * s}px) scale(${s})`
}
function win(sid, x, y, w, h, img, from, to, size = [1920, 1080]) {
  const wid = id('w')
  return { wid, html: `<div class="win" id="${wid}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><img src="${SH(img)}" style="width:${size[0]}px;height:${size[1]}px" alt=""></div>`, img: `#${wid} img`, w, h, from, to }
}

// ---- scenes -------------------------------------------------------------------------------------
const OWN = (n) => `owner/${n}`
const FADE = 0.4
/** Which cut plays: the site trailer (default) or the 30 s advert (`trailer.html?cut=ad`, render.mjs --cut=ad). */
const CUT = new URLSearchParams(location.search).get('cut') === 'ad' ? 'ad' : 'site'
/** Sound cues for music.mjs (advert): { t, kind } — kinds: pop, cut, tick, ping. Read by render.mjs as window.__cues. */
const CUES = []
const cue = (t, kind) => CUES.push({ t: Math.round(t * 1000) / 1000, kind })

// Compass ticks for the in-game backdrop
const compass = (() => {
  const letters = ['С', '', '', 'СВ', '', '', 'В', '', '', 'ЮВ', '', '', 'Ю', '', '', 'ЮЗ', '', '', 'З', '', '', 'СЗ', '', '']
  let h = ''
  for (let i = 0; i < 60; i++) { const t = letters[i % letters.length]; h += `<span>${t ? `<em>${t}</em>` : ''}</span>` }
  return h
})()
const gameBackdrop = (note) => `<div class="game"><div class="haze"></div><div class="ridge"></div><div class="grain"></div><div class="vignette"></div></div>
  <div class="hud"><i></i><i></i><i></i><i></i><div class="hud-note">${note}</div></div>`
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#9fd0a8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke="#7fa183"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>'

// 0. Intro -----------------------------------------------------------------------------------------
sceneEl('s-intro', `
  <div class="title-scene" style="position:absolute;inset:0">
  <div class="title-bg" style="background-image:url(${OWN('overview.webp')})"></div>
  <div class="title-lines"></div><div class="title-glow"></div>
  <div class="title-block">
    <div class="brand-badge" id="intro-badge"><img src="assets/raidos-icon.svg" alt=""></div>
    <div class="kicker" id="intro-kicker">Полевой компаньон</div>
    <div class="big-title" id="intro-title">Raid OS</div>
    <div class="rule" id="intro-rule"></div>
    <div class="tagline" id="intro-tag">Задания<span>·</span>Карты<span>·</span>Цены<span>·</span>Отряд</div>
  </div></div>`)

// 1. Overview: the owner's screenshot, panned from top to bottom, its blocks marked one by one ------------------
// Blocks of owner/overview.webp (1920x1054): [left, top, width, height] in screenshot px
const OV_BOXES = [
  ['ov-b1', [285, 304, 1580, 68], 'Приоритет карт', ''],
  ['ov-b2', [1476, 173, 389, 120], 'Отслеживание Кочевников', 'right'],
  ['ov-b3', [285, 385, 968, 450], 'Карта со всеми точками квестов', ''],
  ['ov-b4', [1263, 385, 602, 312], 'Текущие задания', 'right'],
  ['ov-b5', [285, 848, 968, 166], 'Предметы, требуемые в рейде', ''],
]
sceneEl('s-overview', `

    ${OV_BOXES.map(([id, [x, y, w, h], tag, cls]) => `<div class="hl ${cls}" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><span class="tag">${tag}</span></div>`).join('')}
  </div>
  <div class="top-shade"></div>
  <div class="caption top"><div class="eyebrow"><b>01</b>Обзор</div><h2>Квесты синхронизируются сами</h2><div class="bar"></div></div>`)

// 2. «Продать или оставить?»: a 6x6 stash with the owner's items; the sneaker shows its «Каппа» card, the GPU its MATE card
const CELL = 104
const STASH_ITEMS = [

  ['chain', 0, 3, 1, 1], ['greenbat', 5, 3, 1, 1],
  ['fleece', 3, 4, 2, 1],
]
sceneEl('s-item', `

  <div class="eft-stash" id="stash" style="left:180px;top:150px;width:${6 * CELL + 22}px">

    <div class="eft-grid" style="width:${6 * CELL + 1}px;height:${6 * CELL + 1}px;background-size:${CELL}px ${CELL}px">
      ${STASH_ITEMS.map(([n, x, y, w, h]) => `<div class="eft-item" id="it-${n}" style="left:${x * CELL + 1}px;top:${y * CELL + 1}px;width:${w * CELL - 1}px;height:${h * CELL - 1}px"><img src="${SH(`icon-${n}.png`)}" alt=""><div class="glow"></div></div>`).join('')}
    </div>
  </div>
  <div class="card bare" id="card-sneaker" style="left:930px;top:140px;width:760px"><img src="${SH('overlay-sneaker.png')}" width="760" alt=""></div>
  <div class="card bare" id="card-gpu" style="left:1000px;top:470px;width:700px"><img src="${SH('overlay-gpu.png')}" width="700" alt=""></div>
  <div class="shade" style="background:linear-gradient(180deg, rgb(5 8 6 / 0%) 62%, rgb(5 8 6 / 80%) 82%, rgb(5 8 6 / 96%) 100%)"></div>
  ${captionHtml('02', 'Цена в рейде', 'Продать или оставить?', [['Цена на барахолке и лучший торговец', 'hot'], 'Пометка «Каппа» и MATE'])}`)

// 3. PvP / PvE / Season: the overview of each mode, the switch moving between them ---------------------------
sceneEl('s-modes', `
  <div class="layer" id="md-move">
    <img class="shot" id="md-pvp" src="${SH('mode-pvp.png')}" alt="">
    <img class="shot" id="md-pve" src="${SH('mode-pve.png')}" alt="" style="opacity:0">
    <img class="shot" id="md-season" src="${SH('mode-season.png')}" alt="" style="opacity:0">
  </div>
  <div class="shade"></div>
  <div class="mode-switch-big" id="md-switch" style="left:1250px;top:176px"><div class="knob" id="md-knob"></div><span id="md-l0" class="on">PvP</span><span id="md-l1">PvE</span><span id="md-l2">Сезон</span></div>
  <div class="base-chip" id="md-chip" style="left:1250px;top:294px">Своя база: <b>прогресс, задания, цены</b></div>
  ${captionHtml('03', 'Режимы', 'PvP, PvE и Сезон — у каждого своя база', [['Свой прогресс', 'hot'], 'Свои задания', 'Свои цены на барахолке'])}`)

// 4. Collector: the owner's Collector page (scan sweep, the counter and the Viibiin cell marked) and its «Каппа» card --------
// Window 1680x620 showing owner/collector.webp from x 270, y 95 at scale 1680/1610: a point (X, Y) of the screenshot is at
// ((X - 270) * 1.0435, (Y - 95) * 1.0435) in the window.
const COLL = { x: 120, y: 46, w: 1680, h: 620, s: 1680 / 1610, ox: 270, oy: 95 }
const collBox = (x, y, w, h) => `left:${((x - COLL.ox) * COLL.s).toFixed(1)}px;top:${((y - COLL.oy) * COLL.s).toFixed(1)}px;width:${(w * COLL.s).toFixed(1)}px;height:${(h * COLL.s).toFixed(1)}px`
sceneEl('s-collector', `
  <div class="bg-grid"></div>
  <div class="win" id="coll-win" style="left:${COLL.x}px;top:${COLL.y}px;width:${COLL.w}px;height:${COLL.h}px">
    <img src="${OWN('collector.webp')}" style="width:1915px;height:1049px;transform:translate(${-COLL.ox * COLL.s}px, ${-COLL.oy * COLL.s}px) scale(${COLL.s})" alt="">
    <div class="scan" id="coll-scan" style="top:${(240 - COLL.oy) * COLL.s}px;bottom:0"></div>
    <div class="hl" id="coll-count" style="${collBox(278, 206, 214, 40)}"><span class="tag">Синхронизация из схрона</span></div>
    <div class="hl right" id="coll-viibiin" style="${collBox(1384, 361, 114, 104)}"><span class="tag">Каппа</span></div>
  </div>
  <div class="card bare" id="coll-card" style="left:1180px;top:470px;width:620px"><img src="${SH('overlay-sneaker.png')}" width="620" alt=""></div>
  ${captionHtml('04', 'Путь к Каппе', '«Коллекционер» собирается сам', [['Синхронизация из схрона', 'hot'], 'Что уже собрано', 'Цена и пометка «Каппа»'])}`)

// 5. Squad: members, «Квесты по картам» (the board zooms into the first maps), who shares which quest -----------------
const wMembers = win('s-squad', 120, 46, 1680, 300, 'squad.png', [1080, 422, 1600], [1080, 423, 1588], [1920, 1080])
const wBoard = win('s-squad', 120, 376, 1680, 400, 'squad-board-panel.png', [790, 164, 1600], [560, 192, 1120], [1580, 329])
sceneEl('s-squad', `
  <div class="bg-grid"></div>
  ${wMembers.html}${wBoard.html}
  ${captionHtml('05', 'Отряд', 'Общие квесты на картах', [['Состав отряда', 'hot'], 'Квесты каждого по картам', 'У кого квесты совпадают'])}`)

// 6. Bosses: quick cuts through several bosses, then one 3D model turning and the health card lighting body parts ----
const BOSS_STILLS = ['Решала', 'Килла', 'Глухарь', 'Кабан']
const BOSS3D = 'Тагилла'
const BOSS_FRAMES = 120 // a full turn, 3° a frame
const HP_PARTS = [0, 1, 5] // head, thorax, left leg (BodyParts order)
sceneEl('s-boss', `
  <div class="bg-grid"></div>
  <div class="boss-stage" id="boss-stage" style="left:120px;top:40px;width:860px;height:760px">
    ${BOSS_STILLS.map((_, si) => `<img id="bs-${si}" src="${SH(`bossstill-${si}.png`)}" alt="">`).join('')}
    ${Array.from({ length: BOSS_FRAMES }, (_, f) => `<img id="bf-${f}" src="${SH(`boss3d-0-${String(f).padStart(2, '0')}.png`)}" alt="">`).join('')}
  </div>
  ${[...BOSS_STILLS, BOSS3D].map((name, i) => `<div class="boss-name" id="bn-${i}" style="left:150px;top:60px;opacity:0">${name}${i === BOSS_STILLS.length ? '<span class="badge-3d">3D</span>' : ''}</div>`).join('')}
  <div class="hp-card" id="hp-card" style="left:1080px;top:56px;width:700px;height:879px">
    <img class="base" src="${SH('bosshp-0-idle.png')}" alt="">${HP_PARTS.map((p) => `<img id="hp-${p}" src="${SH(`bosshp-0-${p}.png`)}" alt="">`).join('')}
  </div>
  <svg class="cursor" id="hp-cursor" viewBox="0 0 34 44"><path d="M3 2v34l9-8.5 6.2 14 6-2.7-6-13.6H31L3 2Z" fill="#f4f1e8" stroke="#141a16" stroke-width="2.6" stroke-linejoin="round"/></svg>
  ${captionHtml('06', 'Боссы', 'Боссы в 3D и их здоровье', [['3D-модели', 'hot'], 'HP по частям тела', 'Вооружение и лут'])}`)

// 7. Ammo and the flea market: the penetration chart, the chance per armor class of the selected round, the GPU's prices --
const wBall = win('s-ammo', 120, 70, 1040, 600, 'ballistics.png', [1055, 632, 1540], [1045, 640, 1520])
// «Против брони · BP» panel (982x425 at 1x): class, chance bar, shots on average
const wArmor = win('s-ammo', 1220, 70, 580, 386, 'ballistics-armor.png', [280, 186, 560], [280, 186, 550], [982, 425])
// the flea card's price table (340x955 at 1x): flea (best) and the best trader for the mode
const wFlea = win('s-ammo', 1220, 518, 580, 290, 'flea-card.png', [170, 500, 340], [170, 500, 334], [340, 955])
sceneEl('s-ammo', `

  <div class="label" id="lb-ball" style="left:120px;top:16px">Баллистика · все патроны</div>

  <div class="label green" id="lb-flea" style="left:1220px;top:470px">Барахолка · Видеокарта</div>

// 8. Minimap over the game: the player's point and the quest points nearby ------------------------------------------
sceneEl('s-minimap', `
  ${gameBackdrop('Оверлей поверх игры · пример')}
  <div class="compass"><div class="compass-strip" id="compass-strip">${compass}</div></div>
  <div class="ov-frame" id="mm-card" style="right:120px;top:46px"><img src="${SH('overlay-minimap.png')}" width="660" alt=""><div class="ping" id="mm-ping" style="left:53.4%;top:56.9%"></div></div>

  ${captionHtml('08', 'Мини-карта', 'Мини-карта поверх игры', [['Ваша позиция на карте', 'hot'], 'Квестовые точки рядом', 'Не нужно сворачивать игру'])}`)

sceneEl('s-update', `

sceneEl('s-phone', `

// 11. Sync: PC, website, phone — one base -------------------------------------------------------------------------
const SYNC_ICON = '<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"/></svg>'
sceneEl('s-sync', `

/** Scene fades in over FADE s on top of the previous one, stays opaque until the next has covered it, then drops out. */
function scene(sid, a, b) {
  const d = b - a + FADE
  anim('#' + sid, [{ opacity: 0, offset: 0 }, { opacity: 1, offset: FADE / d }, { opacity: 1, offset: 0.999 }, { opacity: 0, offset: 1 }], a, d, 'linear')
}
function kenBurns(el, from, to, a, b) { anim(el, [{ transform: cam(from) }, { transform: cam(to) }], a, b - a, SMOOTH) }
function regionBurns(w, a, b) { anim(w.img, [{ transform: region(w.w, w.h, w.from) }, { transform: region(w.w, w.h, w.to) }], a, b - a, SMOOTH) }
const rise = (el, a, d = 0.55, dy = 26) => anim(el, [{ opacity: 0, transform: `translateY(${dy}px)` }, { opacity: 1, transform: 'none' }], a, d)
const pop = (el, a, d = 0.55) => anim(el, [{ opacity: 0, transform: 'scale(.92) translateY(14px)' }, { opacity: 1, transform: 'none' }], a, d, POP)
const fadeIn = (el, a, d = 0.4) => anim(el, [{ opacity: 0 }, { opacity: 1 }], a, d, 'ease-in-out')
const fadeOut = (el, a, d = 0.4) => anim(el, [{ opacity: 1 }, { opacity: 0 }], a, d, 'ease-in-out')
/**
 * One property through several values at given times, as ONE animation: separate fill:both animations of the same
 * property override each other (the one created later shows its start value even before it begins).
 * steps: [[seconds, value, easing of the move that starts there?], ...]
 */
function keyframesAt(el, prop, steps, easing = SMOOTH) {
  const t0 = steps[0][0], t1 = steps[steps.length - 1][0]
  return anim(el, steps.map(([t, value, ease]) => ({ [prop]: value, offset: (t - t0) / (t1 - t0), easing: ease ?? easing })), t0, t1 - t0, 'linear')
}
/** Shown only between a and b (no fill outside): one frame of a frame sequence. */
function show(el, a, b) {
  if (typeof el === 'string') el = $(el)
  return el.animate([{ opacity: 1 }, { opacity: 1 }], { delay: ms(a), duration: Math.max(1, ms(b) - ms(a)), fill: 'none' })
}
function caption(sid, a, b) {
  const root = $(`#${sid} .caption`)
  anim(root.querySelector('.eyebrow'), [{ opacity: 0, transform: 'translateY(18px)' }, { opacity: 1, transform: 'none' }], a + 0.15, 0.5)
  anim(root.querySelector('h2'), [{ opacity: 0, transform: 'translateY(34px)', filter: 'blur(8px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], a + 0.25, 0.6)
  anim(root.querySelector('.bar'), [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], a + 0.45, 0.7)
  root.querySelectorAll('.pill').forEach((p, i) => anim(p, [{ opacity: 0, transform: 'translateY(16px) scale(.96)' }, { opacity: 1, transform: 'none' }], a + 0.75 + i * 0.22, 0.45, POP))
  anim(root, [{ opacity: 1 }, { opacity: 0, transform: 'translateY(-10px)' }], b - 0.2, 0.3, 'ease-in')
}
/** A highlight box that goes away again at `out` (one animation for the box, see keyframesAt). */
function markFor(sel, a, out) {
  const d = out + 0.35 - a
  anim(sel, [{ opacity: 0, transform: 'scale(1.04)', easing: EASE }, { opacity: 1, transform: 'none', offset: 0.45 / d }, { opacity: 1, transform: 'none', offset: (out - a) / d, easing: 'ease-in' }, { opacity: 0, transform: 'none' }], a, d, 'linear')
  anim(`${sel} .tag`, [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], a + 0.2, 0.4, POP)
}
/** A highlight box: drawn in (scale + fade), its tag slides in a moment later. */
function mark(sel, a) {
  anim(sel, [{ opacity: 0, transform: 'scale(1.04)' }, { opacity: 1, transform: 'none' }], a, 0.45, EASE)
  anim(`${sel} .tag`, [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], a + 0.2, 0.4, POP)
}

    anim('#outro-badge', [{ opacity: 0, transform: 'scale(.7)' }, { opacity: 1, transform: 'none' }], a + 0.3, 0.55, 'cubic-bezier(.2,1.4,.4,1)')
    anim('#outro-title', [{ opacity: 0, transform: 'translateY(24px)', filter: 'blur(10px) drop-shadow(0 10px 40px rgb(0 0 0 / 70%))' }, { opacity: 1, transform: 'none', filter: 'blur(0) drop-shadow(0 10px 40px rgb(0 0 0 / 70%))' }], a + 0.4, 0.6)
    anim('#outro-cta', [{ opacity: 0, transform: 'translateY(26px) scale(.94)' }, { opacity: 1, transform: 'none' }], a + 0.8, 0.55, 'cubic-bezier(.2,1.3,.4,1)')
    anim('#outro-cta', [{ boxShadow: '0 0 0 1px rgb(255 240 200 / 35%) inset, 0 24px 70px rgb(196 166 101 / 30%), 0 10px 30px rgb(0 0 0 / 50%)' },
      { boxShadow: '0 0 0 1px rgb(255 240 200 / 55%) inset, 0 24px 110px rgb(223 189 112 / 60%), 0 10px 30px rgb(0 0 0 / 50%)' }], a + 1.6, 1.0, 'ease-in-out')
    anim('#outro-tag', [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], a + 1.2, 0.5)
    anim('#outro-site', [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], a + 1.5, 0.5)
  }
}

// ---- the 30 s advert: the strongest scenes, quicker, cut on the beat of music.mjs -----------------------------------
function adTimeline() {
  // the advert plays fewer scenes: number their captions 01, 02, … in its own order
  Object.entries(T).filter(([k]) => $(`#s-${k} .caption .eyebrow b`)).sort((x, y) => x[1][0] - y[1][0])
    .forEach(([k], i) => { $(`#s-${k} .caption .eyebrow b`).textContent = String(i + 1).padStart(2, '0') })
  // 0. Logo (the first impact of the music)
  {
    const [, b] = T.intro
    anim('#s-intro .title-bg', [{ transform: 'scale(1.12)' }, { transform: 'scale(1.02)' }], 0, b, SMOOTH)
    anim('#intro-badge', [{ opacity: 0, transform: 'scale(.5) rotate(-10deg)' }, { opacity: 1, transform: 'none' }], 0.08, 0.55, 'cubic-bezier(.2,1.4,.4,1)')
    cue(0.1, 'logo')
    anim('#intro-kicker', [{ opacity: 0, letterSpacing: '1.1em' }, { opacity: 1, letterSpacing: '.5em' }], 0.25, 0.7)
    anim('#intro-title', [{ opacity: 0, transform: 'translateY(26px) scale(.96)', letterSpacing: '.12em', filter: 'blur(12px) drop-shadow(0 10px 40px rgb(0 0 0 / 70%))' },
      { opacity: 1, transform: 'none', letterSpacing: '.015em', filter: 'blur(0) drop-shadow(0 10px 40px rgb(0 0 0 / 70%))' }], 0.25, 0.7)
    anim('#intro-rule', [{ transform: 'scaleX(0)', opacity: 0 }, { transform: 'scaleX(1)', opacity: 1 }], 0.6, 0.5)
    anim('#intro-tag', [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], 0.75, 0.5)
  }
  // the corner badge while the features play
  keyframesAt('#wm', 'opacity', [[T.overview[0] + 0.4, 0, EASE], [T.overview[0] + 0.9, 1], [T.fair[0], 1, 'ease-in'], [T.fair[0] + 0.4, 0]])
  // 1. Quests sync by themselves: a quicker pan, the blocks marked one after another
  {
    const [a, b] = T.overview
    kenBurns('#ov-move', [1075, 452, 1.2], [1075, 604, 1.2], a + 0.1, b + FADE)
    caption('s-overview', a, b)
    markFor('#ov-b1', a + 0.45, a + 2.3)
    markFor('#ov-b2', a + 0.8, a + 2.4)
    mark('#ov-b4', a + 1.2)
    mark('#ov-b3', a + 1.7)
    mark('#ov-b5', a + 2.4)
    ;[0.45, 0.8, 1.2, 1.7, 2.4].forEach((d) => cue(a + d, 'tick'))
  }
  // 2. Sell or keep: the sneaker's «Каппа» card, then the GPU's MATE card
  {
    const [a, b] = T.item
    anim('#s-item .game', [{ transform: 'scale(1.06)' }, { transform: 'scale(1.1) translateX(-20px)' }], a, b - a + FADE, 'linear')
    rise('#stash', a + 0.15, 0.45, 20)
    anim('#it-sneaker .glow', [{ opacity: 0 }, { opacity: 1, offset: .12 }, { opacity: 1, offset: .65 }, { opacity: 0 }], a + 0.5, 1.9, 'linear')
    anim('#card-sneaker', [{ opacity: 0, transform: 'translateY(16px) scale(.94)', easing: EASE }, { opacity: 1, transform: 'none', offset: .12 }, { opacity: 1, transform: 'scale(1.02)' }], a + 0.7, b - a - 0.3 + FADE, 'linear')
    anim('#it-gpu .glow', [{ opacity: 0 }, { opacity: 1, offset: .15 }, { opacity: 1 }], a + 1.8, b - a - 1.4 + FADE, 'linear')
    anim('#card-gpu', [{ opacity: 0, transform: 'translateY(26px) scale(.92)', easing: EASE }, { opacity: 1, transform: 'none', offset: .15 }, { opacity: 1, transform: 'scale(1.02)' }], a + 2.0, b - a - 1.6 + FADE, 'linear')
    cue(a + 0.7, 'pop'); cue(a + 2.0, 'pop')
    caption('s-item', a, b)
  }
  // 3. Bosses: three quick cuts, a full turn of Tagilla (every other frame: 2 s), the pointer on head, thorax, left leg
  {
    const [a, b] = T.boss
    const cut = 0.36, stills = 3
    for (let si = 0; si < stills; si++) {
      const s0 = a + 0.2 + si * cut
      show(`#bs-${si}`, s0, s0 + cut)
      anim(`#bs-${si}`, [{ transform: 'scale(1.07)' }, { transform: 'scale(1)' }], s0, cut, EASE)
      show(`#bn-${si}`, s0, s0 + cut)
      cue(s0, 'cut')
    }
    const r0 = (Math.round((a + 0.2 + stills * cut) * 30) + 0.5) / 30
    const turn = BOSS_FRAMES / 2
    for (let f = 0; f < turn; f++) show(`#bf-${f * 2}`, r0 + f / 30, r0 + (f + 1) / 30)
    show(`#bf-${BOSS_FRAMES - 1}`, r0 + turn / 30, b + FADE + 1)
    cue(r0, 'cut')
    anim(`#bn-${BOSS_STILLS.length}`, [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], r0, 0.3)
    pop('#hp-card', r0 + 0.1, 0.45)
    const WIN_AT = [[78, 7], [52, 25], [52, 41], [86, 41], [14, 41], [82, 66], [22, 66]]
    const tip = (p) => `translate(${1080 + 7 * WIN_AT[p][0] + 40}px, ${56 + 8.79 * WIN_AT[p][1] + 6}px)`
    const away = 'translate(1860px, 990px)'
    anim('#hp-cursor', [{ opacity: 0 }, { opacity: 1 }], r0 + 0.2, 0.2, 'linear')
    const path = [[r0 + 0.2, away]]
    HP_PARTS.forEach((p, i) => {
      const on = r0 + 0.75 + i * 1.0
      path.push([on - 0.35, path[path.length - 1][1]], [on, tip(p)])
      const lit = [[r0, 0], [on, 0, 'ease-in-out'], [on + 0.2, 1]]
      if (i < HP_PARTS.length - 1) lit.push([on + 0.85, 1, 'ease-in-out'], [on + 1.0, 0])
      keyframesAt(`#hp-${p}`, 'opacity', lit, 'linear')
      cue(on, 'tick')
    })
    keyframesAt('#hp-cursor', 'transform', path)
    caption('s-boss', a, b)
  }
  // 4. Squad: members, then the map board zooms in
  {
    const [a, b] = T.squad
    pop('#' + wMembers.wid, a + 0.1, 0.5); regionBurns(wMembers, a + 0.1, b + FADE)
    pop('#' + wBoard.wid, a + 0.3, 0.5); regionBurns(wBoard, a + 0.9, b + FADE)
    cue(a + 0.3, 'pop')
    caption('s-squad', a, b)
  }
  // 5. Minimap: the card, the player's point pulses
  {
    const [a, b] = T.minimap
    anim('#s-minimap .game', [{ transform: 'scale(1.06)' }, { transform: 'scale(1.12) translateX(30px)' }], a, b - a + FADE, 'linear')
    anim('#compass-strip', [{ transform: 'translateX(-200px)' }, { transform: 'translateX(-520px)' }], a, b - a + FADE, SMOOTH)
    anim('#mm-card', [{ opacity: 0, transform: 'translateY(24px) scale(.94)', easing: EASE }, { opacity: 1, transform: 'none', offset: .12 }, { opacity: 1, transform: 'scale(1.03)' }], a + 0.25, b - a + FADE - 0.25, 'linear')
    $('#mm-ping').animate([{ opacity: 0, transform: 'scale(.5)' }, { opacity: 0.95, offset: 0.1 }, { opacity: 0, transform: 'scale(2.6)' }], { delay: ms(a + 0.8), duration: 900, iterations: 3, fill: 'both', easing: 'ease-out' })
    cue(a + 0.8, 'ping'); cue(a + 1.7, 'ping')
    caption('s-minimap', a, b)
  }
  // 6. PC · site · phone
  {
    const [a, b] = T.sync
    pop('#d-pc', a + 0.1, 0.5); pop('#d-web', a + 0.25, 0.5); pop('#d-ph', a + 0.4, 0.5)
    ;['#sy-pc', '#sy-web', '#sy-ph'].forEach((sel, i) => rise(sel, a + 0.45 + i * 0.15, 0.35, 8))
    anim('#n1', [{ opacity: 0, transform: 'scale(.4)' }, { opacity: 1, transform: 'none' }], a + 0.7, 0.4, POP)
    anim('#n2', [{ opacity: 0, transform: 'scale(.4)' }, { opacity: 1, transform: 'none' }], a + 0.85, 0.4, POP)
    anim('#n1', [{ rotate: '0deg' }, { rotate: '360deg' }], a + 1.0, b - a, 'linear')
    anim('#n2', [{ rotate: '0deg' }, { rotate: '-360deg' }], a + 1.1, b - a, 'linear')
    cue(a + 0.7, 'tick'); cue(a + 0.85, 'tick')
    caption('s-sync', a, b)
  }
  // 7. Fair play, quickly
  {
    const [a] = T.fair
    anim('#fair-shield', [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }], a + 0.15, 0.5, 'cubic-bezier(.2,1.4,.4,1)')
    anim('#fair-title', [{ opacity: 0, transform: 'translateY(24px)', filter: 'blur(8px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], a + 0.3, 0.5)
    anim('#fair-lead', [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], a + 0.55, 0.4)
    document.querySelectorAll('#fair-list li').forEach((li, i) => anim(li, [{ opacity: 0, transform: 'translateY(16px) scale(.96)' }, { opacity: 1, transform: 'none' }], a + 0.7 + i * 0.16, 0.4, POP))
  }
  // 8. End card (the last impact of the music)
  {
    const [a] = T.outro
    anim('#s-outro .title-bg', [{ transform: 'scale(1.02)' }, { transform: 'scale(1.1)' }], a, DURATION - a + 0.6, 'linear')
    anim('#outro-badge', [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }], a + 0.2, 0.5, 'cubic-bezier(.2,1.4,.4,1)')
    anim('#outro-title', [{ opacity: 0, transform: 'translateY(24px)', filter: 'blur(10px) drop-shadow(0 10px 40px rgb(0 0 0 / 70%))' }, { opacity: 1, transform: 'none', filter: 'blur(0) drop-shadow(0 10px 40px rgb(0 0 0 / 70%))' }], a + 0.3, 0.5)
    anim('#outro-cta', [{ opacity: 0, transform: 'translateY(26px) scale(.94)' }, { opacity: 1, transform: 'none' }], a + 0.6, 0.5, 'cubic-bezier(.2,1.3,.4,1)')
    anim('#outro-cta', [{ boxShadow: '0 0 0 1px rgb(255 240 200 / 35%) inset, 0 24px 70px rgb(196 166 101 / 30%), 0 10px 30px rgb(0 0 0 / 50%)' },
      { boxShadow: '0 0 0 1px rgb(255 240 200 / 55%) inset, 0 24px 110px rgb(223 189 112 / 60%), 0 10px 30px rgb(0 0 0 / 50%)' }], a + 1.3, 1.0, 'ease-in-out')
    anim('#outro-tag', [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], a + 0.9, 0.45)
    anim('#outro-site', [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], a + 1.15, 0.45)
  }
}

if (CUT === 'ad') adTimeline()
else siteTimeline()

const all = () => document.getAnimations()
all().forEach((a) => a.pause())
window.__seek = (seconds) => { for (const a of all()) { a.pause(); a.currentTime = ms(seconds) } }
window.__play = () => { for (const a of all()) { a.currentTime = 0; a.play() } }
window.__duration = DURATION
window.__times = T
window.__cues = CUES
window.__cut = CUT
window.__ready = (async () => {
  await document.fonts.ready
  await Promise.all([...document.images].map((img) => img.decode().catch(() => {})))
  window.__seek(0)
  return true
})()
if (location.hash === '#autoplay') window.__ready.then(() => window.__play())
</script>
