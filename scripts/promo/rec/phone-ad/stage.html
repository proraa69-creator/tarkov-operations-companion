<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The phone-apps ad, drawn frame by frame (build.mjs): render(t) sets every element from the video time t alone. -->
<style>
@font-face { font-family: Inter; src: url(inter-cyrillic.woff2) format('woff2'); unicode-range: U+0400-04FF; font-weight: 100 900 }
@font-face { font-family: Inter; src: url(inter-latin.woff2) format('woff2'); font-weight: 100 900 }
@font-face { font-family: Oswald; src: url(oswald-cyrillic.woff2) format('woff2'); unicode-range: U+0400-04FF; font-weight: 200 700 }
@font-face { font-family: Oswald; src: url(oswald-latin.woff2) format('woff2'); font-weight: 200 700 }
:root { --brass: #c4a665; --brass-strong: #f1d98f; --text: #f1ead6; --muted: #b9c2b5; --dim: #7f8a7e; --line: #2a332c }
* { box-sizing: border-box }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #070908 }
body { font-family: Inter, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased }
#bg { position: absolute; inset: 0;
  background: radial-gradient(900px 700px at 50% 6%, rgb(196 166 101 / 14%), transparent 70%), radial-gradient(1100px 900px at 50% 105%, rgb(70 92 66 / 32%), transparent 70%),
    linear-gradient(180deg, #0c110e 0%, #0a0d0b 55%, #0d120f 100%) }
#grid { position: absolute; inset: -40px; opacity: .2;
  background-image: linear-gradient(rgb(196 166 101 / 16%) 1px, transparent 1px), linear-gradient(90deg, rgb(196 166 101 / 16%) 1px, transparent 1px);
  background-size: 72px 72px; mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 30%, transparent 85%) }
.layer { position: absolute; left: 0; top: 0; will-change: transform, opacity }
.center { position: absolute; left: 0; right: 0; text-align: center }
.eyebrow { font-weight: 800; font-size: 26px; letter-spacing: .2em; text-transform: uppercase; color: var(--brass) }
.title { font-family: Oswald, sans-serif; font-weight: 600; font-size: 74px; line-height: 1.04; letter-spacing: .005em; text-transform: uppercase; color: var(--text) }
.title em { font-style: normal; color: var(--brass-strong) }
/* «iOS» keeps its own letters in the upper-case titles. */
.title .as-is { text-transform: none }
.sub { font-size: 30px; line-height: 1.4; color: var(--muted) }

/* iPhone: titanium frame, side buttons, Dynamic Island, status bar; the app's own picture inside. */
#phone { position: absolute; left: 0; top: 0; width: 628px; height: 1399px; margin: -699.5px 0 0 -314px }
#body { position: absolute; inset: 0; border-radius: 82px; padding: 14px;
  background: linear-gradient(135deg, #8d8f8a 0%, #3c3f3b 7%, #1b1d1b 30%, #2a2c29 62%, #77796f 100%);
  box-shadow: inset 0 0 0 2px rgb(255 255 255 / 12%), inset 0 0 0 7px #0d0f0e, 0 50px 120px rgb(0 0 0 / 70%) }
.btn { position: absolute; width: 8px; border-radius: 3px; background: linear-gradient(90deg, #5e605b, #9a9c95 50%, #4a4c48) }
#screen { position: relative; width: 600px; height: 1371px; border-radius: 68px; overflow: hidden; background: #0b0e0c }
#status { position: absolute; left: 0; top: 0; right: 0; height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 8px 52px 0 64px;
  background: #0b0e0c; font-weight: 700; font-size: 26px; z-index: 2 }
#island { position: absolute; left: 50%; top: 16px; width: 186px; height: 50px; margin-left: -93px; border-radius: 26px; background: #000; z-index: 3 }
.sbar { display: flex; align-items: center; gap: 9px }
.sig { display: flex; align-items: flex-end; gap: 3px; height: 20px } .sig i { width: 5px; background: var(--text); border-radius: 1.5px }
.batt { width: 42px; height: 21px; border: 2px solid rgb(241 234 214 / 60%); border-radius: 7px; padding: 2px } .batt i { display: block; height: 100%; width: 78%; background: var(--text); border-radius: 2px }
#appwrap { position: absolute; left: 0; top: 66px; width: 600px; height: 1305px; overflow: hidden }
#app { position: absolute; left: 0; top: 0; width: 600px; height: 1305px }

/* PC */
#monitor { width: 1000px; height: 575px; padding: 14px; border-radius: 22px; background: linear-gradient(160deg, #2c312e, #121513 50%, #23282a); box-shadow: 0 0 0 2px #0a0c0b, 0 40px 90px rgb(0 0 0 / 65%) }
#pcscreen { position: relative; width: 972px; height: 547px; border-radius: 10px; overflow: hidden; background: #0b0e0c }
#stand { width: 190px; height: 50px; margin: 0 auto; background: linear-gradient(180deg, #1a1e1c, #0f1211); clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%) }
#game, #stash { position: absolute; inset: 0 }
#game svg { width: 100%; height: 100%; display: block }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0 }
.tag { position: absolute; left: 14px; bottom: 12px; padding: 5px 11px; border-radius: 999px; background: rgb(0 0 0 / 55%); color: rgb(241 234 214 / 75%); font-size: 17px; font-weight: 600 }
#stash { background: radial-gradient(700px 400px at 70% 20%, rgb(80 90 76 / 35%), transparent 70%), linear-gradient(180deg, #1c211d, #0e110f) }
#stash .head { position: absolute; left: 34px; top: 26px; font-family: Oswald, sans-serif; font-size: 30px; letter-spacing: .12em; color: #cfc8b2 }
#cells { position: absolute; left: 34px; top: 80px; display: grid; grid-template-columns: repeat(13, 64px); grid-auto-rows: 64px; gap: 2px }
#cells span { background: rgb(255 255 255 / 4%); border: 1px solid rgb(255 255 255 / 7%); display: grid; place-items: center }
#cells img { width: 60px; height: 60px; object-fit: contain }
#tooltip { position: absolute; padding: 7px 12px; background: rgb(14 16 15 / 94%); border: 1px solid #5c5a4d; color: #e9e3cf; font-size: 19px; white-space: nowrap; opacity: 0 }
#cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; filter: drop-shadow(0 3px 6px rgb(0 0 0 / 70%)) }
.key { position: absolute; min-width: 140px; height: 116px; padding: 0 26px; display: grid; place-items: center; border-radius: 18px;
  font-weight: 800; font-size: 44px; color: #1a1d18; background: linear-gradient(180deg, #f6f0dc, #d9cfb3); box-shadow: 0 11px 0 #9d916f, 0 22px 40px rgb(0 0 0 / 60%) }
.key small { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 19px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--brass-strong); text-shadow: 0 2px 6px #000 }
.wave { position: absolute; border-radius: 22px; border: 3px solid var(--brass-strong); opacity: 0 }

/* Pointers: a numbered label, a line to the target, an arrowhead and a soft pulse on the target. */
#pointers { position: absolute; inset: 0; pointer-events: none }
#pointers svg { position: absolute; inset: 0; overflow: visible }
.plabel { position: absolute; display: flex; align-items: center; gap: 12px; padding: 12px 20px 12px 12px; border-radius: 16px; max-width: 430px;
  border: 1.5px solid rgb(241 217 143 / 70%); background: rgb(13 17 14 / 94%); box-shadow: 0 14px 34px rgb(0 0 0 / 55%); font-size: 27px; font-weight: 800; line-height: 1.15 }
.plabel b { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%; background: linear-gradient(180deg, #f1d98f, #c4a665); color: #16130b; font-size: 24px }

/* Chips and badges */
.chips { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap }
.chip { padding: 12px 24px; border-radius: 999px; border: 1.5px solid rgb(196 166 101 / 45%); background: rgb(18 25 21 / 85%); font-size: 30px; font-weight: 700; color: var(--muted) }
.chip.on { color: #16130b; background: linear-gradient(180deg, #f1d98f, #c4a665); border-color: transparent }
.badges { display: flex; justify-content: center; gap: 20px }
.badge { display: flex; align-items: center; gap: 14px; padding: 16px 30px 16px 24px; border-radius: 20px; border: 1.5px solid rgb(241 234 214 / 22%); background: rgb(14 18 16 / 88%); font-size: 36px; font-weight: 800 }
.badge svg { width: 38px; height: 38px }
.url { display: inline-block; padding: 16px 40px; border-radius: 999px; background: linear-gradient(180deg, #f1d98f, #c4a665); color: #16130b; font-weight: 900; font-size: 44px; letter-spacing: .02em }
.logo { display: flex; align-items: center; justify-content: center; gap: 22px }
.logo img { width: 112px; height: 112px }
.logo b { font-family: Oswald, sans-serif; font-weight: 700; font-size: 72px; letter-spacing: .14em }
.disc { font-size: 19px; line-height: 1.45; color: var(--dim) }
</style>
</head>
<body>
<div id="bg"></div><div id="grid"></div>

<div id="intro" class="layer" style="width:1080px">
  <div class="logo center" id="i-logo" style="top:150px"><img src="raidos-icon.svg" alt=""><b>RAID OS</b></div>
  <div class="eyebrow center" id="i-hello" style="top:330px;font-size:34px"></div>
  <div class="title center" id="i-title" style="top:395px"></div>
  <div class="sub center" id="i-sub" style="top:592px;font-size:38px;color:var(--text);font-weight:700"></div>
  <div class="badges center" id="i-badges" style="top:676px"></div>
  <div class="center" id="i-url" style="top:800px"><span class="url">raidos.app</span></div>
</div>

<div id="c-tour" class="layer center" style="top:100px"><div class="eyebrow" data-t="tourEyebrow"></div><div class="title" style="margin-top:12px;font-size:66px" data-t="tourTitle"></div><div class="chips" id="chips" style="margin-top:26px"></div></div>
<div id="c-map" class="layer center" style="top:70px"><div class="eyebrow" data-t="mapEyebrow"></div><div class="title" style="margin-top:10px;font-size:58px" data-t="mapTitle"></div></div>
<div id="c-item" class="layer center" style="top:70px"><div class="eyebrow" data-t="itemEyebrow"></div><div class="title" style="margin-top:10px;font-size:58px" data-t="itemTitle"></div></div>
<div id="c-test" class="layer center" style="top:96px"><div class="eyebrow" data-t="testEyebrow"></div><div class="title" style="margin-top:12px;font-size:62px" data-t="testTitle"></div><div class="sub" style="margin-top:16px" data-t="testSub"></div></div>

<div id="pc" class="layer">
  <div id="monitor"><div id="pcscreen">
    <div id="game"><svg viewBox="0 0 972 547" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3a3b"/><stop offset=".55" stop-color="#6d6650"/><stop offset=".78" stop-color="#b48c58"/></linearGradient>
        <radialGradient id="sun" cx="690" cy="262" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffd99a" stop-opacity=".8"/><stop offset="1" stop-color="#ffd99a" stop-opacity="0"/></radialGradient>
        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f25"/><stop offset="1" stop-color="#151a14"/></linearGradient>
        <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9b089" stop-opacity="0"/><stop offset=".5" stop-color="#c9b089" stop-opacity=".22"/><stop offset="1" stop-color="#c9b089" stop-opacity="0"/></linearGradient>
      </defs>
      <rect width="972" height="547" fill="url(#sky)"/><rect width="972" height="547" fill="url(#sun)"/>
      <path d="M0 300 30 288 52 296 80 280 104 292 130 276 160 290 196 282 226 294 262 284 300 296 330 300 V340 H0Z" fill="#34403a"/>
      <path d="M560 302 590 286 612 296 640 280 668 294 700 284 736 296 770 280 806 292 840 284 880 296 920 286 972 296 V340 H560Z" fill="#34403a"/>
      <g fill="#232b27">
        <rect x="300" y="196" width="250" height="140"/><rect x="330" y="176" width="60" height="22"/><rect x="560" y="236" width="120" height="100"/><rect x="96" y="252" width="150" height="84"/>
        <rect x="720" y="214" width="16" height="122"/><path d="M712 214h32l-16-36Z"/>
      </g>
      <g fill="#e3b862" opacity=".85"><rect x="322" y="222" width="14" height="10"/><rect x="384" y="222" width="14" height="10"/><rect x="446" y="248" width="14" height="10"/><rect x="508" y="222" width="14" height="10"/><rect x="352" y="274" width="14" height="10"/><rect x="478" y="300" width="14" height="10"/><rect x="590" y="262" width="12" height="9"/><rect x="132" y="276" width="12" height="9"/></g>
      <g fill="#2d3530" opacity=".9"><rect x="322" y="248" width="14" height="10"/><rect x="384" y="274" width="14" height="10"/><rect x="446" y="222" width="14" height="10"/><rect x="508" y="274" width="14" height="10"/><rect x="416" y="300" width="14" height="10"/><rect x="630" y="262" width="12" height="9"/></g>
      <rect y="336" width="972" height="211" fill="url(#ground)"/>
      <path d="M430 336h112l250 211H180Z" fill="#30342d"/><path d="M484 344h6l14 40h-12ZM488 404h12l20 62h-18ZM494 488h22l18 59h-26Z" fill="#c9b989" opacity=".55"/>
      <rect y="250" width="972" height="140" fill="url(#fog)"/>
      <g fill="none" stroke="#e9e3cf" stroke-opacity=".7" stroke-width="1.5"><path d="M366 26v10M406 26v6M446 26v10M486 26v6M526 26v10M566 26v6M606 26v10"/></g>
      <g fill="#e9e3cf" fill-opacity=".8" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle"><text x="366" y="54" data-svg="compass0"></text><text x="486" y="54" data-svg="compass1"></text><text x="606" y="54" data-svg="compass2"></text></g>
      <g><rect x="396" y="512" width="180" height="5" rx="2.5" fill="#000" fill-opacity=".45"/><rect x="396" y="512" width="132" height="5" rx="2.5" fill="#d8d2bd" fill-opacity=".8"/><rect x="396" y="522" width="180" height="4" rx="2" fill="#000" fill-opacity=".45"/><rect x="396" y="522" width="158" height="4" rx="2" fill="#9fbf7a" fill-opacity=".8"/></g>
    </svg><span class="tag" data-t="illustration"></span></div>
    <div id="stash"><div class="head" data-t="stash"></div><div id="cells"></div><div id="tooltip"></div>
      <svg id="cursor" viewBox="0 0 28 28"><path d="M5 3.2 5.1 22.6 10 18.1 13.2 25.4 16.6 23.9 13.5 16.8 20.2 16.4Z" fill="#fbf8ef" stroke="#141812" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span class="tag" data-t="illustration"></span></div>
    <div id="flash"></div>
  </div></div>
  <div id="stand"></div>
</div>
<div id="key" class="key"><small></small><span></span></div><div id="wave" class="wave"></div>

<div id="phone">
  <i class="btn" style="left:-7px;top:250px;height:56px"></i><i class="btn" style="left:-7px;top:350px;height:96px"></i><i class="btn" style="left:-7px;top:466px;height:96px"></i>
  <i class="btn" style="right:-7px;top:390px;height:150px"></i><i class="btn" style="right:-7px;top:640px;height:110px;opacity:.7"></i>
  <div id="body"><div id="screen">
    <div id="status"><span id="clock">21:46</span><span class="sbar"><span class="sig"><i style="height:6px"></i><i style="height:10px"></i><i style="height:14px"></i><i style="height:19px"></i></span>
      <svg width="28" height="20" viewBox="0 0 28 20"><path d="M14 18.5 9.7 13.6a6.2 6.2 0 0 1 8.6 0ZM5.6 9.4a12 12 0 0 1 16.8 0l-2.1 2.4a8.8 8.8 0 0 0-12.6 0ZM1.4 5.1a17.9 17.9 0 0 1 25.2 0l-2.1 2.4a14.7 14.7 0 0 0-21 0Z" fill="#f1ead6"/></svg>
      <span class="batt"><i></i></span></span></div>
    <div id="island"></div>
    <div id="appwrap"><img id="app" alt=""></div>
  </div></div>
</div>

<div id="pointers"><svg id="psvg"><g id="beam"></g></svg></div>

<div id="outro" class="layer" style="width:1080px">
  <div class="logo center" style="top:430px"><img src="raidos-icon.svg" alt=""><b>RAID OS</b></div>
  <div class="title center" id="o-tag" style="top:610px;font-size:84px"></div>
  <div class="center sub" id="o-dl" style="top:880px;color:var(--text);font-weight:700" data-t="download"></div>
  <div class="center" id="o-url" style="top:950px"><span class="url" style="font-size:56px;padding:20px 54px">raidos.app</span></div>
  <div class="badges center" id="o-badges" style="top:1120px"></div>
  <div class="center disc" id="o-disc" style="top:1760px;padding:0 90px"></div>
</div>

<script>
const P = JSON.parse(new URLSearchParams(location.search).get('p'))
const X = P.text
/**
 * A still for a post (stills.mjs) instead of a video frame: the phone at its own place, the camera inside it fixed, the
 * named pointers on (at their own places when given), the key held up, no signal in flight.
 */
const STILL = P.still
const $ = (id) => document.getElementById(id)
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const out = (x) => 1 - Math.pow(1 - clamp(x), 3)
const back = (x) => { x = clamp(x); const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
const rise = (t, a, d = 0.45) => out((t - a) / d)
const span = (t, a, b, d = 0.35) => Math.min(rise(t, a, d), 1 - rise(t, b - d, d))
const lerp = (a, b, k) => a + (b - a) * k
const set = (el, { x = 0, y = 0, s = 1, o = 1 } = {}) => { el.style.transform = `translate(${x}px, ${y}px) scale(${s})`; el.style.opacity = String(o) }

document.documentElement.lang = P.lang
for (const node of document.querySelectorAll('[data-t]')) node.innerHTML = X[node.dataset.t]
$('i-hello').textContent = X.hello
$('i-title').innerHTML = X.introTitle
$('i-sub').innerHTML = X.introSub
$('o-tag').innerHTML = X.tagline
$('o-disc').innerHTML = X.disclaimer
const PHONE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="#f1ead6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>'
const DROID = '<svg viewBox="0 0 24 24" fill="none" stroke="#a5d36b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10a7 7 0 0 1 14 0v7H5Z"/><path d="M8 4 6.5 2M16 4l1.5-2"/><circle cx="9.5" cy="7.5" r=".6" fill="#a5d36b"/><circle cx="14.5" cy="7.5" r=".6" fill="#a5d36b"/></svg>'
const WIN = '<svg viewBox="0 0 24 24" fill="#7fb8e8"><path d="M3 5.5 10.5 4.5v7H3ZM11.5 4.4 21 3v8.5h-9.5ZM3 12.5h7.5v7L3 18.5ZM11.5 12.5H21V21l-9.5-1.4Z"/></svg>'
const badge = (icon, name) => `<span class="badge">${icon}${name}</span>`
$('i-badges').innerHTML = badge(PHONE_ICON, 'iOS') + badge(DROID, 'Android')
// A still may leave elements out and move others (stills.mjs).
for (const id of STILL?.hide ?? []) $(id).style.display = 'none'
for (const [id, top] of Object.entries(STILL?.tops ?? {})) $(id).style.top = `${top}px`
$('o-badges').innerHTML = badge(PHONE_ICON, 'iOS') + badge(DROID, 'Android') + badge(WIN, 'Windows')
$('chips').innerHTML = X.chips.map((c) => `<span class="chip">${c}</span>`).join('')
for (const [i, node] of document.querySelectorAll('[data-svg^=compass]').entries()) node.textContent = X.compass[i]
$('cells').innerHTML = P.stash.map((src) => `<span>${src ? `<img src="${src}" alt="">` : ''}</span>`).join('')
$('tooltip').textContent = X.itemName

const app = $('app')
let current = ''
window.setPhone = async (src) => { if (src === current) return; current = src; app.src = src; await app.decode().catch(() => {}) }

const S = P.scenes, M = P.moments, V = P.voice, B = P.boxes
const PC = { x: 40, y: 228 }
/** The book's cell on the PC screen, in canvas pixels (its centre). */
const BOOK = { x: PC.x + 14 + P.bookCell[0] + 32, y: PC.y + 14 + P.bookCell[1] + 32 }

// ---- the phone's place: centre x, centre y, scale, opacity ------------------------------------------------------------
const PLACE = { intro: [540, 1445, 0.64], tour: [540, 1105, 0.94], pop: [715, 1300, 0.8], testing: [650, 1160, 0.86] }
const between = (t, cut, a, b, d = 0.6) => { const k = ease((t - cut + d / 2) / d); return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)] }
function phonePlace(t) {
  if (STILL?.place) return [...STILL.place, 1]
  const hidden = [PLACE.pop[0], 2700, PLACE.pop[2]]
  if (t < S.tour[0] - 0.3) return [...PLACE.intro, 1]
  if (t < S.tour[0] + 0.3) return [...between(t, S.tour[0], PLACE.intro, PLACE.tour), 1]
  // «map»: the phone goes away, the PC comes; on the screenshot it pops up over the PC.
  if (t < S.map[0] + 0.45) { const k = ease((t - S.map[0] + 0.15) / 0.6); return [lerp(PLACE.tour[0], hidden[0], k), lerp(PLACE.tour[1], hidden[1], k), lerp(PLACE.tour[2], hidden[2], k), 1] }
  if (t < M.positionSent) return [...hidden, 0]
  if (t < M.positionSent + 0.6) { const k = (t - M.positionSent) / 0.6; return [PLACE.pop[0], lerp(1750, PLACE.pop[1], back(k)), lerp(0.22, PLACE.pop[2], back(k)), clamp(k * 5)] }
  if (t < S.testing[0] - 0.3) return [...PLACE.pop, 1]
  if (t < S.testing[0] + 0.3) return [...between(t, S.testing[0], PLACE.pop, PLACE.testing), 1]
  return [...PLACE.testing, 1 - rise(t, S.outro[0] + 0.05, 0.5)]
}

// ---- the camera inside the screen: in on the player, then on the item card ---------------------------------------------
const K = 600 / 402 // app picture pixels per phone point
function zoomAt(t) {
  if (STILL?.zoom === 'none') return { z: 1, ox: 300, oy: 652 }
  if (STILL?.zoom === 'item') return { z: 1.38, ox: 0.09 * 600, oy: 0.16 * 1305 }
  if (STILL?.zoom === 'map') return { z: 1.5, ox: 0.5 * 600, oy: 0.34 * 1305 }
  const zMap = span(t, M.positionSent + 2.4, M.itemSent + 0.2, 0.6), zItem = span(t, M.itemSent + 0.6, S.item[1] - 0.15, 0.6)
  if (zItem > 0) return { z: 1 + 0.38 * zItem, ox: 0.09 * 600, oy: 0.16 * 1305 }
  return { z: 1 + 0.5 * zMap, ox: 0.5 * 600, oy: 0.34 * 1305 }
}
/** A point of the phone (points of the 402 × 874 app) on the canvas, or null when it is off the screen. */
function onCanvas(px, py, place, zoom) {
  const ix = zoom.ox + (px * K - zoom.ox) * zoom.z, iy = zoom.oy + (py * K - zoom.oy) * zoom.z
  if (ix < 0 || iy < 0 || ix > 600 || iy > 1305) return null
  const lx = 14 + ix, ly = 14 + 66 + iy
  return { x: place[0] + (lx - 314) * place[2], y: place[1] + (ly - 699.5) * place[2] }
}

// ---- pointers ------------------------------------------------------------------------------------------------------------
const svg = $('psvg')
const POINTERS = [
  { id: 'nav', from: S.tour[0] + 0.5, to: 7.75, box: 'nav', at: [0.5, 0.25], pos: 'above', n: '' },
  { id: 'map', from: M.positionSent + 0.6, to: M.positionSent + 2.5, box: 'mapName', at: [0.5, 0.5], pos: [36, 1100], n: '1' },
  { id: 'me', from: M.positionSent + 2.4, to: S.item[0] - 0.1, box: 'player', at: [0.5, 0.5], pos: [36, 1330], n: '2' },
  { id: 'hover', from: M.itemHover + 0.7, to: M.itemSent + 0.3, point: () => BOOK, pos: [36, 1100], n: '1' },
  { id: 'price', from: M.itemSent + 0.9, to: S.item[1] - 0.25, box: 'prices', at: [0.05, 0.5], pos: [36, 1100], n: '2' },
  { id: 'kappa', from: M.itemSent + 1.7, to: S.item[1] - 0.25, box: 'kappa', at: [0.1, 0.5], pos: [36, 1360], n: '3' },
  { id: 'chat', from: M.chat + 0.25, to: S.testing[1] - 0.1, box: 'chat', at: [0.3, 0.5], pos: [30, 1290], n: '' },
]
for (const p of POINTERS) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
  g.innerHTML = `<circle class="pulse" r="30" fill="none" stroke="#f1d98f" stroke-width="3"/><line stroke="#f1d98f" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/><path class="head" d="M0 0-20-11-20 11Z" fill="#f1d98f"/>`
  svg.appendChild(g)
  const label = document.createElement('div')
  label.className = 'plabel'
  // A still numbers only its own pointers, from 1.
  const n = STILL ? (p.n && STILL.pointers?.includes(p.id) ? String(STILL.pointers.filter((id) => POINTERS.find((q) => q.id === id)?.n).indexOf(p.id) + 1) : '') : p.n
  label.innerHTML = `${n ? `<b>${n}</b>` : ''}<span>${X.pointers[p.id]}</span>`
  $('pointers').appendChild(label)
  p.g = g; p.el = label
}
function renderPointers(t, place, zoom) {
  for (const p of POINTERS) {
    const o = STILL ? (STILL.pointers?.includes(p.id) ? 1 : 0) : span(t, p.from, p.to, 0.25)
    const pos = STILL?.pos?.[p.id] ?? p.pos
    let target = null
    if (o > 0) {
      if (p.point) target = p.point()
      else if (B[p.box]) { const b = B[p.box]; target = onCanvas(b.x + b.w * p.at[0], b.y + b.h * p.at[1], place, zoom) }
    }
    if (!target || o <= 0 || place[3] < 0.9) { p.g.style.opacity = '0'; p.el.style.opacity = '0'; continue }
    // The label sits at its place, or centred above its target («above»); the line runs from it to the target.
    const lw = p.el.offsetWidth, lh = p.el.offsetHeight, above = pos === 'above'
    const lx = above ? clamp(target.x - lw / 2, 30, 1050 - lw) : pos[0]
    const ly = above ? target.y - lh - 150 : pos[1]
    const bob = Math.sin((t - p.from) * 6) * 5 * o
    p.el.style.left = `${lx}px`; p.el.style.top = `${ly}px`; p.el.style.opacity = String(o)
    p.el.style.transform = `translateY(${(1 - o) * 14}px)`
    const sx = above ? lx + lw / 2 : lx + lw, sy = above ? ly + lh : ly + lh / 2
    const ang = Math.atan2(target.y - sy, target.x - sx), dist = Math.hypot(target.x - sx, target.y - sy)
    const tip = { x: target.x - Math.cos(ang) * (26 + bob), y: target.y - Math.sin(ang) * (26 + bob) }
    const line = p.g.querySelector('line')
    line.setAttribute('x1', sx + Math.cos(ang) * 8); line.setAttribute('y1', sy + Math.sin(ang) * 8)
    line.setAttribute('x2', tip.x - Math.cos(ang) * 16); line.setAttribute('y2', tip.y - Math.sin(ang) * 16)
    line.style.opacity = dist > 70 ? '1' : '0'
    p.g.querySelector('.head').setAttribute('transform', `translate(${tip.x} ${tip.y}) rotate(${ang * 180 / Math.PI})`)
    const ring = p.g.querySelector('.pulse'), phase = ((t - p.from) % 1.2) / 1.2
    ring.setAttribute('cx', target.x); ring.setAttribute('cy', target.y); ring.setAttribute('r', String(18 + 26 * phase)); ring.style.opacity = String(0.8 * (1 - phase))
    p.g.style.opacity = String(o)
  }
}

const beam = $('beam')
beam.innerHTML = Array.from({ length: 6 }, (_, i) => `<circle r="${14 - i * 2}" fill="#f1d98f" opacity="${1 - i * 0.16}"/>`).join('')
const quad = (a, c, b, k) => ({ x: (1 - k) * (1 - k) * a.x + 2 * (1 - k) * k * c.x + k * k * b.x, y: (1 - k) * (1 - k) * a.y + 2 * (1 - k) * k * c.y + k * k * b.y })
function renderBeam(t) {
  const runs = [{ at: M.screenshotKey, from: { x: PC.x + 500, y: PC.y + 300 } }, { at: M.itemKey, from: BOOK }]
  const run = !STILL && runs.find((r) => t >= r.at && t < r.at + 0.75)
  if (!run) { beam.style.opacity = '0'; return }
  const to = { x: PLACE.pop[0], y: PLACE.pop[1] - 380 }, ctrl = { x: (run.from.x + to.x) / 2 + 220, y: Math.min(run.from.y, to.y) - 60 }
  const k = (t - run.at) / 0.55
  ;[...beam.children].forEach((dot, i) => { const p = quad(run.from, ctrl, to, clamp(k - i * 0.05)); dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y) })
  beam.style.opacity = String(k < 1 ? 1 : clamp(1 - (k - 1) / 0.35))
  beam.style.filter = 'drop-shadow(0 0 10px #f1d98f)'
}

window.render = (t) => {
  // Intro
  set($('intro'), { o: 1 - rise(t, S.tour[0] - 0.35, 0.35) })
  set($('i-logo'), { y: (1 - rise(t, 0.15)) * 30, o: rise(t, 0.15) })
  set($('i-hello'), { y: (1 - rise(t, 0.4)) * 24, o: rise(t, 0.4) })
  set($('i-title'), { y: (1 - rise(t, 1.2)) * 28, o: rise(t, 1.2) })
  set($('i-sub'), { y: (1 - rise(t, 2.2)) * 24, o: rise(t, 2.2) })
  set($('i-badges'), { y: (1 - rise(t, 3.3)) * 26, o: rise(t, 3.3) })
  set($('i-url'), { s: 0.92 + 0.08 * rise(t, 4.2), o: rise(t, 4.2) })

  // Captions
  set($('c-tour'), { o: span(t, S.tour[0] + 0.1, S.tour[1]) })
  const words = X.chipTimes.map((d) => V[1].at + d)
  ;[...document.querySelectorAll('.chip')].forEach((chip, i) => { const on = t >= words[i]; chip.classList.toggle('on', on); chip.style.transform = `scale(${on ? 1 + 0.08 * (1 - rise(t, words[i], 0.3)) : 1})` })
  set($('c-map'), { o: span(t, S.map[0] + 0.1, S.map[1]) })
  set($('c-item'), { o: span(t, S.item[0] + 0.05, S.item[1]) })
  set($('c-test'), { o: span(t, S.testing[0] + 0.1, S.testing[1]) })

  // PC: in for «map» and «item» — the game, then the stash.
  const pcIn = span(t, S.map[0] + 0.05, S.item[1] - 0.1, 0.45)
  set($('pc'), { x: PC.x, y: PC.y + (1 - pcIn) * -40, o: pcIn })
  const stash = rise(t, S.item[0] - 0.2, 0.4)
  $('game').style.opacity = String(1 - stash); $('stash').style.opacity = String(stash)
  $('flash').style.opacity = String(!STILL && t >= M.screenshotKey ? 0.6 * (1 - rise(t, M.screenshotKey, 0.35)) : 0)
  const cur = ease((t - M.itemHover) / 0.55)
  const bx = P.bookCell[0], by = P.bookCell[1]
  $('cursor').style.transform = `translate(${lerp(760, bx + 30, cur)}px, ${lerp(440, by + 34, cur)}px)`
  const tip = $('tooltip')
  tip.style.left = `${bx + 52}px`; tip.style.top = `${by + 66}px`; tip.style.opacity = String(rise(t, M.itemHover + 0.6, 0.2))

  // The key: PrtSc for the screenshot, «;» (the app's default item key) for the item.
  const key = $('key'), wave = $('wave')
  const isItem = t > S.item[0]
  const press = isItem ? M.itemKey : M.screenshotKey
  const k = STILL ? (STILL.key ? 1 : 0) : isItem ? span(t, M.itemKey - 0.9, M.itemKey + 1.5, 0.3) : span(t, M.screenshotKey - 1.0, M.screenshotKey + 1.5, 0.3)
  key.querySelector('span').textContent = isItem ? ';' : 'PrtSc'
  key.querySelector('small').textContent = isItem ? X.itemKey : X.screenshotKey
  const down = STILL ? 0 : t >= press && t < press + 0.16 ? 1 : t >= press + 0.16 && t < press + 0.32 ? 1 - (t - press - 0.16) / 0.16 : 0
  key.style.left = '70px'; key.style.top = '890px'
  key.style.opacity = String(k * pcIn)
  key.style.transform = `translateY(${down * 10}px) scale(${0.8 + 0.2 * k})`
  key.style.boxShadow = `0 ${11 - down * 9}px 0 #9d916f, 0 22px 40px rgb(0 0 0 / 60%)`
  const w = clamp((t - press) / 0.7)
  wave.style.left = '70px'; wave.style.top = '890px'; wave.style.width = `${key.offsetWidth}px`; wave.style.height = '116px'
  wave.style.opacity = String(!STILL && t >= press ? 0.9 * (1 - w) * pcIn : 0); wave.style.transform = `scale(${1 + 0.6 * w})`

  // Phone
  const place = phonePlace(t)
  const enter = rise(t, 0.55, 0.9)
  set($('phone'), { x: place[0], y: place[1] + (1 - enter) * 900, s: place[2], o: Math.min(1, enter * 1.4) * place[3] })
  const zoom = zoomAt(t)
  app.style.transformOrigin = `${zoom.ox}px ${zoom.oy}px`
  app.style.transform = `scale(${zoom.z})`
  renderPointers(t, [place[0], place[1] + (1 - enter) * 900, place[2], Math.min(1, enter * 1.4) * place[3]], zoom)
  renderBeam(t)

  // Outro
  set($('outro'), { o: rise(t, S.outro[0] + 0.15, 0.5) })
  set($('o-tag'), { y: (1 - rise(t, V[5].at + 0.75, 0.5)) * 26, o: rise(t, V[5].at + 0.75, 0.5) })
  set($('o-dl'), { o: rise(t, V[5].at + 1.9, 0.4) })
  set($('o-url'), { s: 0.9 + 0.1 * rise(t, V[5].at + 2.0, 0.5), o: rise(t, V[5].at + 2.0, 0.5) })
  set($('o-badges'), { y: (1 - rise(t, V[5].at + 2.5, 0.5)) * 20, o: rise(t, V[5].at + 2.5, 0.5) })
  set($('o-disc'), { o: 0.9 * rise(t, V[5].at + 2.8, 0.6) })
  if (STILL?.discTop) $('o-disc').style.top = `${STILL.discTop}px`
}
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((img) => img.decode().catch(() => {}))])
</script>
